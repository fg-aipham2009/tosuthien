# Demo: docker compose up -d --build
#   API:   http://localhost:8000
#   Admin: http://localhost:5173
# Flutter: chạy local — flutter run -d macos hoặc -d ios (cần Xcode)
#
# Trước khi hỏi đáp hybrid: python3 scripts/embed_server.py  (port 7997)

name: tosuthien

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tosu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tosuthien}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thamthien}
      POSTGRES_DB: ${POSTGRES_DB:-tosuthien}
    # Tune for 2-core / ~4GB VPS — use both cores without starving API/embed.
    command:
      - postgres
      - -c
      - max_worker_processes=2
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Schema for isolated CBETA DB (created by init/02-create-cbeta-db.sh)
      - ./docker/postgres/cbeta:/cbeta-schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tosuthien} -d ${POSTGRES_DB:-tosuthien}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-tosuthien-api:local}
    build:
      context: ./nestjs
      dockerfile: Dockerfile
    pull_policy: ${API_PULL_POLICY:-missing}
    container_name: tosu_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tosuthien}:${POSTGRES_PASSWORD:-thamthien}@db:5432/${POSTGRES_DB:-tosuthien}?connection_limit=5&pool_timeout=20
      # Isolated CBETA RAG DB (same Postgres, different database name)
      CBETA_DATABASE_URL: postgresql://${POSTGRES_USER:-tosuthien}:${POSTGRES_PASSWORD:-thamthien}@db:5432/cbeta
      DATA_ROOT: /data
      TEXT_BOOKS_ROOT: /text-books
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.tosuthien.net}
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      # host.docker.internal → embed_server.py on the host (port 7997)
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:7997/v1}
      # HARD-PINNED: CBETA chunk_embeddings are BGE-M3 1024-d.
      # Do NOT use ${EMBEDDING_MODEL} from .env — a stale MiniLM/384 there used to
      # silently win over the default and break hybrid (Vector dim 1024 != 384).
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DIM: "1024"
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-local}
      # HARD-PIN hhtech only — no flare/nexus fallback (bad key used to silently hit nexus).
      CHAT_PROVIDER: hhtech
      # HARD-PIN Opus 5.5 — do not interpolate from .env (stale claude-opus-5 used to win).
      CHAT_MODEL: claude-opus-5-5
      CHAT_FALLBACK_PROVIDER: ""
      FLARE_BASE_URL: ${FLARE_BASE_URL:-https://9flare.com/api/v1}
      FLARE_CHAT_MODEL: pro/claude-opus-5-5-medium
      HHTECH_BASE_URL: ${HHTECH_BASE_URL:-https://hhtechapi.com/v1}
      # HHTECH_API_KEY: only via env_file (.env). Do NOT set
      # HHTECH_API_KEY: ${HHTECH_API_KEY} here — empty host shell overrides
      # env_file with "" and breaks rewrite (401 Invalid API key).
      HHTECH_CHAT_MODEL: claude-opus-5-5
      # Fast model for VN→Hán rewrite only (answer path still uses Opus above).
      # Rewrite default = Opus 5.5 (same as answer). Override via CBETA_REWRITE_MODEL.
      CBETA_REWRITE_MODEL: ${CBETA_REWRITE_MODEL:-claude-opus-5-5}
      CBETA_REWRITE_CACHE_SIZE: ${CBETA_REWRITE_CACHE_SIZE:-256}
      CBETA_REWRITE_TIMEOUT_MS: ${CBETA_REWRITE_TIMEOUT_MS:-15000}
      NEXUS_BASE_URL: ${NEXUS_BASE_URL:-https://api.nexusmmo.store/v1}
      NEXUS_CHAT_MODEL: claude-opus-5-5
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - ./text/doc-chu/books:/text-books:ro
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: ./vuejs
      dockerfile: Dockerfile
    container_name: tosu_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
