# https://tosuthien.com — Next.js site → 127.0.0.1:5175
# Cert: certbot certonly --nginx -d tosuthien.com -d www.tosuthien.com

upstream tosuthien_site_com {
    server 127.0.0.1:5175;
    keepalive 32;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tosuthien.com www.tosuthien.com;

    ssl_certificate /etc/letsencrypt/live/tosuthien.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosuthien.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /manifest.webmanifest {
        alias /opt/tosu-thien/site/public/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }
    location = /sw.js {
        alias /opt/tosu-thien/site/public/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /pwa-register.js {
        alias /opt/tosu-thien/site/public/pwa-register.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location ^~ /icons/ {
        alias /opt/tosu-thien/site/public/icons/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Same-origin API → Nest on this VPS (no hop via api.tosuthien.net).
    location = /api/rag/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Static media (MP3/PDF/images) — Nest ServeStatic /files → localhost.
    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://tosuthien_site_com;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;

        sub_filter_once on;
        sub_filter '</head>' '<link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="tosuthien.com"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/pwa-register.js" defer></script></head>';
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tosuthien.com www.tosuthien.com;
    return 301 https://tosuthien.com$request_uri;
}
