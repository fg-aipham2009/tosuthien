# https://tosuthien.net — Vue portal (static portal-dist)
# NOT the tosuthien.com Next site (that is demo.tosuthien.net / tosuthien.com).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tosuthien.net www.tosuthien.net;

    ssl_certificate /etc/letsencrypt/live/tosuthien.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosuthien.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/tosu-thien/portal-dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API (browser → nginx → Nest). Faster than api.tosuthien.net for MP3 lists.
    location = /api/rag/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Static media (MP3/PDF/images) — Nest ServeStatic /files → localhost.
    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tosuthien.net www.tosuthien.net;
    return 301 https://tosuthien.net$request_uri;
}
