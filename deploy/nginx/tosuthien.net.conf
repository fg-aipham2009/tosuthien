# https://tosuthien.net — Vue portal (static portal-dist)
# NOT the tosuthien.com Next site (that is demo.tosuthien.net / tosuthien.com).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tosuthien.net www.tosuthien.net;

    ssl_certificate /etc/letsencrypt/live/tosuthien.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosuthien.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/tosu-thien/portal-dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tosuthien.net www.tosuthien.net;
    return 301 https://tosuthien.net$request_uri;
}
