# Public portal — https://tosuthien.net (Next.js → 127.0.0.1:3000) + PWA

upstream tosuthien_portal {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name tosuthien.net www.tosuthien.net;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # PWA static assets (served directly; no Next hop)
    location = /manifest.webmanifest {
        alias /opt/tosu-thien/portal-next/public/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }
    location = /sw.js {
        alias /opt/tosu-thien/portal-next/public/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /pwa-register.js {
        alias /opt/tosu-thien/portal-next/public/pwa-register.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location ^~ /icons/ {
        alias /opt/tosu-thien/portal-next/public/icons/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://tosuthien_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;

        # Inject PWA tags into HTML head
        # sub_filter_types defaults to text/html
        sub_filter_once on;
        sub_filter '</head>' '<link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="To Su Thien"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/pwa-register.js" defer></script></head>';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tosuthien.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tosuthien.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.tosuthien.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = tosuthien.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name tosuthien.net www.tosuthien.net;
    return 404; # managed by Certbot
}
