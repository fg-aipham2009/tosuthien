# https://demo.tosuthien.net — Next.js site (tosuthien.com preview) → 127.0.0.1:5175
# NOT admin. Admin: https://admin.tosuthien.net → 127.0.0.1:5173

upstream tosuthien_site {
    server 127.0.0.1:5175;
    keepalive 32;
}

# --- shared location blocks (HTTP + HTTPS) ---
# Cert paths: certbot certonly/nginx for demo.tosuthien.net

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.tosuthien.net;

    ssl_certificate /etc/letsencrypt/live/demo.tosuthien.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.tosuthien.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /manifest.webmanifest {
        alias /opt/tosu-thien/site/public/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }
    location = /sw.js {
        alias /opt/tosu-thien/site/public/sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /pwa-register.js {
        alias /opt/tosu-thien/site/public/pwa-register.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location ^~ /icons/ {
        alias /opt/tosu-thien/site/public/icons/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://tosuthien_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;

        sub_filter_once on;
        sub_filter '</head>' '<link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="tosuthien.com"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/pwa-register.js" defer></script></head>';
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.tosuthien.net;
    return 301 https://demo.tosuthien.net$request_uri;
}
