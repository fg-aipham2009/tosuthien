# https://api.tosuthien.net → Nest Docker :8000
# TLS: SAN on cert tosuthien.net (admin, api, app, www)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.tosuthien.net;

    ssl_certificate /etc/letsencrypt/live/tosuthien.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosuthien.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1G;

    location = /api/rag/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tosuthien.net;
    return 301 https://api.tosuthien.net$request_uri;
}
