# https://admin.tosuthien.net → Vue admin Docker :5173

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.tosuthien.net;

    ssl_certificate /etc/letsencrypt/live/tosuthien.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tosuthien.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1G;

    location / {
        proxy_pass http://127.0.0.1:5173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.tosuthien.net;
    return 301 https://admin.tosuthien.net$request_uri;
}
